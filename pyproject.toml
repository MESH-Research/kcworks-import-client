[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
name = "kcworks-import-client"
version = "0.1.0"
description = "Standalone client scripts for importing works into KCWorks via the import API"
readme = "README.md"
keywords = ["client", "import", "inveniordm", "kcworks"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MESH Research", email = "scottia4@msu.edu" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]
optional-dependencies.dev = [
  "bump-my-version==1.5.1",
  "check-manifest",
  "kcworks-import-client[docs,tests]",
]
optional-dependencies.docs = [
  "furo>=2023",
  "linkify-it-py>=2.0.3",
  "myst-parser>=2",
  "sphinx>=7",
  "sphinx-copybutton>=0.5",
]
optional-dependencies.tests = [
  "pytest>=7.3",
  "pytest-cov>=6.2.1",
  "pytest-ruff>=0.1",
  "pyyaml>=6",
  "requests-mock",
  "ruff>=0.3",
  "ty",
]
optional-dependencies.yaml = ["pyyaml>=6"]
urls.Documentation = "https://mesh-research.github.io/kcworks-import-client/"
urls.Homepage = "https://github.com/MESH-Research/kcworks-import-client"
scripts.kcworks-api-importer = "kcworks_import_client.api_importer:main"
scripts.kcworks-multi-collection-importer = "kcworks_import_client.multi_collection_importer:cli"

[tool.setuptools]
packages.find.where = ["."]
packages.find.include = ["kcworks_import_client*"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["**/*.ipynb", "docs", "node_modules", "tests/helpers"]
# temporarily removed C for complexity checks
lint.select = ["B", "D", "DOC", "E", "F", "I", "UP"]
# Now Ruff handles formatting, so enable formatting rules
lint.ignore = [
  "D412", # Missing blank line before closing docstring
  # Keep some warnings disabled
  "W1", # Indentation warnings
  "W2", # Whitespace warnings
  "W3", # Blank line warnings
]
lint.per-file-ignores."__init__.py" = ["D104", "E402", "F401"]
lint.isort.known-first-party = ["kcworks_import_client", "tests"]
lint.pydocstyle.convention = "google"
lint.preview = true

[tool.ty]
analysis = {}
# Type checking with ty (replaces mypy). Mirrors the parent KCWorks
# project's [tool.ty] settings; paths adapted to this package's layout.
environment.python-version = "3.12"
# Rule severities (ty uses rule names; mypy options translated below)
# warn_redundant_casts = true
rules.redundant-cast = "warn"
# warn_unused_ignores = false → don't warn about unused type: ignore
rules.unused-ignore-comment = "ignore"
rules.unused-type-ignore-comment = "ignore"
# ignore_missing_imports = true → suppress unresolved-import
rules.unresolved-import = "ignore"
# allow_untyped_globals = true → don't error on undeclared globals
rules.unresolved-global = "ignore"
# Don't type-check tests.
src.exclude = ["tests"]

[tool.pytest]
ini_options.testpaths = ["tests"]
ini_options.pythonpath = ["."]
ini_options.addopts = """
--ruff
--ignore=docs
"""

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false
allow_shell_hooks = false
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
key_path = "project.version"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
key_path = "tool.bumpversion.current_version"

[[tool.bumpversion.files]]
filename = "VERSION"

[[tool.bumpversion.files]]
filename = "kcworks_import_client/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
