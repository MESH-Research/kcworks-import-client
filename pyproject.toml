[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
name = "kcworks-import-client"
version = "0.1.0"
description = "Standalone client scripts for importing works into KCWorks via the import API"
readme = "README.md"
keywords = ["import", "kcworks", "inveniordm", "client"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MESH Research", email = "scottia4@msu.edu" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.28",
]
optional-dependencies.yaml = [
  "PyYAML>=6",
]
optional-dependencies.docs = [
  "furo>=2023",
  "linkify-it-py>=2.0.3",
  "myst-parser>=2",
  "sphinx>=7",
  "sphinx-copybutton>=0.5",
]
optional-dependencies.tests = [
  "PyYAML>=6",
  "pytest>=7.3",
  "pytest-cov>=6.2.1",
  "ruff>=0.3",
]
optional-dependencies.dev = [
  "check-manifest",
  "kcworks-import-client[docs,tests]",
]
urls.Homepage = "https://github.com/MESH-Research/kcworks-import-client"
urls.Documentation = "https://mesh-research.github.io/kcworks-import-client/"
scripts.kcworks-api-importer = "kcworks_import_client.api_importer:main"
scripts.kcworks-multi-collection-importer = "kcworks_import_client.multi_collection_importer:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["kcworks_import_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
  "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
